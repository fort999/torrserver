worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8090;

        location / {
            proxy_pass http://127.0.0.1:8091;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            sub_filter_once on;
            sub_filter_types text/html;
            sub_filter '</head>' '<script>(function(){var p=window.location.pathname,m="/api/hassio_ingress/",s=p.indexOf(m);if(s===-1)return;var e=p.indexOf("/",s+m.length);if(e===-1)return;var b=p.slice(0,e),r=function(u){if(typeof u!=="string")return u;try{var x=new URL(u,window.location.href);return x.origin===window.location.origin&&x.pathname.indexOf(b+"/")!==0?b+x.pathname+x.search+x.hash:u}catch(_){return u}},o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(){var a=[].slice.call(arguments);a[1]=r(a[1]);return o.apply(this,a)};var w=window.open;window.open=function(u){var a=[].slice.call(arguments);a[0]=r(u);return w.apply(window,a)}})();</script></head>';
        }
    }
}
